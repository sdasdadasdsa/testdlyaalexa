<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4fbf5">
<title>APK Qo‘riqchi — Ilova holati</title>
<style>
:root{--ink:#123b29;--green:#078742;--red:#d52635}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#dcebe1;color:var(--ink)}
.page{
 position:relative;isolation:isolate;display:grid;
 grid-template-rows:auto auto minmax(0,1fr) auto;
 width:100%;max-width:490px;height:100vh;height:100svh;height:100dvh;
 margin:0 auto;overflow:hidden;
 padding:max(18px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));
 background:linear-gradient(155deg,#fcfffd 0%,#effcf4 52%,#e7f7ed 100%);
}
.page:before{content:"";position:absolute;inset:-14% -30% 40%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at top,#dff8e5,transparent 70%)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:46px}
.app-icon{width:45px;height:45px;flex:none;border-radius:14px;object-fit:cover;border:1px solid #d1e3cc;background:white;box-shadow:0 4px 12px #19431e1b}
.brand{min-width:0}
.brand strong{display:block;font-size:17px;letter-spacing:-.65px;line-height:1.13;font-weight:900;color:#143525;white-space:nowrap}
.brand small{display:block;font-size:11px;color:#63856c;font-weight:700;margin-top:3px;letter-spacing:.35px}
.brand-check{margin-left:auto;display:grid;place-items:center;width:33px;height:33px;flex:none;border-radius:50%;background:#e3f9e8;border:1px solid #cae7d0;color:#21934f}
.brand-check svg{width:18px;height:18px}
.warning{display:flex;align-items:center;gap:12px;padding:15px 14px;border-radius:20px;border:1.5px solid #f0a9ad;background:linear-gradient(135deg,#fff1f2,#ffe8e9);box-shadow:0 7px 17px #c61a2110}
.alert{display:grid;place-items:center;flex:none;align-self:flex-start;width:43px;height:43px;border-radius:14px;color:#fff;background:linear-gradient(150deg,#f05057,#c81629);box-shadow:0 5px 11px #c8162926}
.alert svg{width:25px;height:25px}
.warning h1{margin:0;font-size:clamp(19px,5.6vw,25px);font-weight:900;letter-spacing:-.75px;line-height:1.14;color:#bd1827;text-wrap:balance}
.warning p{margin:6px 0 0;color:#9e5260;font-weight:600;font-size:12px;line-height:1.25}
.hero{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;padding:15px 0 7px}
.hero-card{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:0;overflow:hidden;border-radius:30px;background:linear-gradient(159deg,#e7fff0 0%,#d7f4e2 48%,#c8eedb 100%);border:1px solid #d2ecda;box-shadow:inset 0 2px 8px #ffffffb0,0 10px 32px #1f683315}
.hero-card:before{content:"";position:absolute;width:min(92%,380px);aspect-ratio:1;border:2px solid #a0dabd86;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-52%);box-shadow:0 0 0 28px #d6f8e255,0 0 0 57px #e1fced40}
.hero-card:after{content:"";position:absolute;bottom:3%;left:15%;right:15%;height:10%;border-radius:50%;background:radial-gradient(ellipse,#185c4230,transparent 68%);filter:blur(9px)}
.decor{position:absolute;z-index:1;color:#43a773;opacity:.8}
.decor.a{top:12%;left:7%;width:24px;height:24px}
.decor.b{top:18%;right:8%;width:18px;height:18px;opacity:.55}
.decor.c{bottom:20%;right:8%;width:15px;height:15px;opacity:.35}
.hero img.mascot{z-index:2;position:relative;display:block;height:99%;width:98%;object-fit:contain;object-position:center center;filter:drop-shadow(0 12px 10px #1b5b3c33)}
.bottom{display:flex;align-items:center;gap:13px;margin-top:11px;border:1.5px solid #acd5b5;border-radius:20px;padding:16px 14px;background:linear-gradient(120deg,#f7fff9,#e3f9e9);box-shadow:0 5px 17px #25723d12}
.permission-icon{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:14px;color:white;background:linear-gradient(145deg,#13b75c,#04783b);box-shadow:0 4px 10px #087a3a25}
.permission-icon svg{width:24px;height:24px}
.bottom p{margin:0;color:#166438;font-size:clamp(14px,4vw,17px);line-height:1.28;letter-spacing:-.2px;font-weight:850}
@media(min-width:640px){body{display:grid;place-items:center}.page{border-radius:24px;height:min(100dvh,920px);box-shadow:0 20px 80px #154c3444}}
@media(max-height:750px){.page{padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}.topbar{margin-bottom:10px;min-height:40px}.app-icon{width:39px;height:39px;border-radius:12px}.brand strong{font-size:16px}.warning{padding:11px 12px;border-radius:16px}.alert{width:36px;height:36px;border-radius:11px}.alert svg{width:22px;height:22px}.warning h1{font-size:clamp(19px,5.8vw,23px)}.warning p{margin-top:4px;font-size:11px}.hero{padding:10px 0 5px}.hero-card{border-radius:24px}.bottom{margin-top:8px;padding:11px 12px;border-radius:16px}.permission-icon{width:39px;height:39px;border-radius:12px}.bottom p{font-size:14px}}
@media(max-height:530px){.page{padding-top:max(7px,env(safe-area-inset-top));padding-bottom:max(7px,env(safe-area-inset-bottom))}.topbar{min-height:30px;margin-bottom:6px;gap:7px}.app-icon{width:30px;height:30px;border-radius:9px}.brand strong{font-size:14px}.brand small{font-size:9px;margin-top:1px}.brand-check{width:27px;height:27px}.warning{padding:8px 9px;gap:8px;border-radius:13px}.alert{height:29px;width:29px;border-radius:9px}.alert svg{height:18px;width:18px}.warning h1{font-size:clamp(17px,5.5vw,20px);letter-spacing:-.3px}.warning p{font-size:9px;margin-top:2px}.hero{padding:6px 0 2px}.hero-card{border-radius:19px}.bottom{gap:9px;margin-top:6px;padding:7px 9px;border-radius:12px}.permission-icon{width:31px;height:31px;border-radius:9px}.permission-icon svg{width:19px;height:19px}.bottom p{font-size:12px}}
@media(max-width:340px){.page{padding-left:12px;padding-right:12px}.warning h1{font-size:19px}.bottom p{font-size:12px}}

/* Intro loading splash: animation only, not a security scan */
.js .page:not(.is-loaded) > :not(.intro-loader){visibility:hidden}
.intro-loader{display:none}
.js .intro-loader{display:flex;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#fcfffd 0%,#edfbf2 60%,#def4e6 100%);transition:opacity .4s ease,visibility .4s ease}
.js .page.is-loaded .intro-loader{opacity:0;visibility:hidden;pointer-events:none}
.intro-mark{display:grid;place-items:center;width:94px;height:94px;margin-bottom:23px;border-radius:30px;background:linear-gradient(150deg,#f7fff9,#d6f7e0);box-shadow:0 13px 33px #036a3230,inset 0 2px 0 #fff;border:1px solid #abdfbc;animation:intro-breathe 1.25s ease-in-out infinite}
.intro-mark svg{width:56px;height:56px;filter:drop-shadow(0 3px 3px #0e703329)}
.intro-title{font-size:27px;font-weight:900;letter-spacing:-1px;color:#12643c}
.intro-subtitle{margin-top:7px;font-size:14px;font-weight:600;color:#628870}
.intro-progress{margin-top:26px;width:min(245px,74vw);height:9px;background:#d5ecdd;border:1px solid #c9e6d1;border-radius:20px;overflow:hidden;box-shadow:inset 0 1px 3px #044f3517}
.intro-progress-bar{height:100%;width:0%;border-radius:inherit;background:linear-gradient(90deg,#0a9e4f,#32d979,#0a9e4f);background-size:200% 100%;animation:progress-glint 1s linear infinite;transition:width .065s linear}
.intro-counter{margin-top:10px;color:#268054;font-size:13px;font-weight:850;font-variant-numeric:tabular-nums}
@keyframes intro-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.065)}}
@keyframes progress-glint{to{background-position:-200% 0}}
@keyframes hero-float{0%,100%{transform:translateY(2px)}50%{transform:translateY(-8px)}}
@keyframes halo-glow{0%,100%{opacity:.68;scale:.97}50%{opacity:1;scale:1.06}}
@keyframes little-star{0%,100%{transform:rotate(-10deg) scale(.8);opacity:.45}50%{transform:rotate(15deg) scale(1.18);opacity:1}}
@keyframes icon-pulse{0%,100%{box-shadow:0 4px 10px #087a3a25}50%{box-shadow:0 4px 13px #087a3a48,0 0 0 6px #38ba6620}}
@keyframes alert-glow{0%,85%,100%{box-shadow:0 5px 11px #c8162926}92%{box-shadow:0 5px 14px #c8162944,0 0 0 5px #ee5b5b22}}
@keyframes enter-rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes enter-zoom{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.page.is-loaded .topbar{animation:enter-rise .55s both}
.page.is-loaded .warning{animation:enter-rise .6s .12s both}
.page.is-loaded .hero-card{animation:enter-zoom .62s .25s both}
.page.is-loaded .bottom{animation:enter-rise .6s .39s both}
.page.is-loaded .hero img.mascot{animation:hero-float 4s ease-in-out 1s infinite}
.page.is-loaded .hero-card:before{animation:halo-glow 5s ease-in-out 1s infinite}
.page.is-loaded .decor{animation:little-star 3s ease-in-out infinite}
.page.is-loaded .decor.b{animation-delay:.65s}
.page.is-loaded .decor.c{animation-delay:1.45s}
.page.is-loaded .permission-icon{animation:icon-pulse 3s ease-in-out 1.5s infinite}
.page.is-loaded .alert{animation:alert-glow 4.5s ease-in-out 2s infinite}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.js .intro-loader{display:none!important}.js .page:not(.is-loaded)>:not(.intro-loader){visibility:visible!important}}
</style>
<script>document.documentElement.classList.add('js');</script>
</head>

(function(){
 const page=document.querySelector('.page');
 const fill=document.querySelector('.intro-progress-bar');
 const counter=document.querySelector('.intro-counter');
 if(!page)return;
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){page.classList.add('is-loaded');return;}
 const start=performance.now();
 const duration=1700;
 function draw(t){
  const fraction=Math.min(1,(t-start)/duration);

  const value=Math.round(eased*100);

 }

})();
